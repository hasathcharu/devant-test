services:
  temporal-ui:
    image: temporalio/ui:latest
    environment:
      TEMPORAL_ADDRESS: default-mltfigfo64.svc.dev.paas.wso2.com:443
      TEMPORAL_DEFAULT_NAMESPACE: default
      TEMPORAL_TLS_SERVER_NAME: default-mltfigfo64.svc.dev.paas.wso2.com
      TEMPORAL_TLS_ENABLE_HOST_VERIFICATION: "true"
      TEMPORAL_FORWARD_HEADERS: Authorization
      TEMPORAL_CORS_ORIGINS: http://localhost:8080

  proxy:
    image: caddy:2
    ports:
      - "8080:8080"
    environment:
      TEMPORAL_API_KEY: ${TEMPORAL_API_KEY}
    command: >
      caddy reverse-proxy --from :8080 --to temporal-ui:8080
      --header-up "Authorization: Bearer {env.TEMPORAL_API_KEY}"