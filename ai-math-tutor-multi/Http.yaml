openapi: 3.0.1
info:
  title: Http
  version: 0.1.0
servers:
- url: "{server}:{port}/http"
  variables:
    server:
      default: http://localhost
    port:
      default: "7070"
paths:
  /hello:
    get:
      operationId: getHello
      responses:
        "200":
          description: Ok
          content:
            text/plain:
              schema:
                type: string
